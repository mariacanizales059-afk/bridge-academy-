<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge Academy - Portugués</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f7f2e9;font-family:Arial,sans-serif;color:#073259}body{display:grid;place-items:center;overflow:hidden}.reel{position:relative;width:min(100vw,607px);height:100vh;min-height:650px;overflow:hidden;background:radial-gradient(circle at 80% 20%,#ffcf4138 0,transparent 35%),linear-gradient(#fffaf2,#eef7ed)}.brand{position:absolute;top:4%;width:100%;text-align:center}.brand b{font:clamp(30px,7vw,51px) Georgia,serif;letter-spacing:.2em}.brand span{display:block;margin-top:5px;color:#148044;letter-spacing:.45em}.flag{font-size:42px;margin-bottom:12px}.quiz{position:absolute;top:19%;left:6%;width:88%;padding:28px 24px;border:2px solid #0b7a43;border-radius:22px;background:#fff;box-shadow:0 16px 40px #07325922;text-align:center;transition:.55s}.label{color:#148044;font-weight:800;letter-spacing:.12em}.quiz h1{font-size:clamp(31px,7vw,52px);line-height:1.05;margin:22px 0 12px}.word{display:inline-block;margin:18px 0 25px;padding:15px 22px;border-radius:12px;background:#ffcb36;color:#073259;font:700 clamp(29px,7vw,50px) Georgia,serif}.question{font-size:clamp(19px,4vw,27px)}.buttons{display:flex;gap:14px;margin-top:25px}.choice{flex:1;padding:15px;border:2px solid #148044;border-radius:12px;background:white;color:#073259;font-size:22px;font-weight:800}.choice.wrong{background:#ef5656;color:#fff;border-color:#ef5656}.result{position:absolute;top:20%;left:6%;width:88%;text-align:center;opacity:0;transform:scale(.9);transition:.55s}.result.show{opacity:1;transform:none}.x{font-size:55px}.result h2{font-size:clamp(36px,8vw,62px);margin:8px 0 20px}.meaning{padding:21px;border-radius:16px;background:#fff;box-shadow:0 12px 35px #0732591c;font-size:clamp(20px,4vw,28px);line-height:1.65;text-align:left}.meaning b{color:#148044}.lesson{margin-top:22px;color:#073259;font-size:clamp(20px,4.5vw,30px);font-weight:800}.cta{position:absolute;bottom:4%;left:6%;width:88%;padding:16px;border-radius:15px;background:#087447;color:#fff;text-align:center;opacity:0;transition:.6s}.cta.show{opacity:1}.cta b{display:block;color:#ffdc55;font-size:clamp(20px,4.5vw,30px)}.cta strong{display:block;font-size:clamp(28px,6vw,42px)}button{position:absolute;right:10px;bottom:10px;border:0;border-radius:7px;padding:7px 10px;background:#07325922;color:#073259;z-index:5}
</style></head><body><main class="reel"><header class="brand"><b>BRIDGE</b><span>ACADEMY</span></header><section class="quiz" id="quiz"><div class="flag">🇧🇷</div><div class="label">DETECTOR DE PORTUÑOL</div><h1>¿Significa<br>“embarazada”?</h1><div class="word">Embaraçada</div><div class="question">Elegí una respuesta:</div><div class="buttons"><div class="choice" id="yes">SÍ</div><div class="choice">NO</div></div></section><section class="result" id="result"><div class="x">❌</div><h2>¡CUIDADO CON<br>EL PORTUÑOL!</h2><div class="meaning"><b>Embaraçada</b> = avergonzada o incómoda<br><b>Grávida</b> = embarazada</div><div class="lesson">Aprendé portugués de verdad.</div></section><section class="cta" id="cta"><b>CLASE INTRODUCTORIA GRATIS</b><span>Reservá por WhatsApp</span><strong>8406-3557</strong></section><button id="repeat">Repetir</button></main><script>
const quiz=document.querySelector('#quiz'),yes=document.querySelector('#yes'),result=document.querySelector('#result'),cta=document.querySelector('#cta');let timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function start(){timers.forEach(clearTimeout);quiz.style.opacity='1';quiz.style.transform='none';yes.classList.remove('wrong');result.classList.remove('show');cta.classList.remove('show');later(()=>yes.classList.add('wrong'),1800);later(()=>{quiz.style.opacity='0';quiz.style.transform='scale(.9)';result.classList.add('show')},3000);later(()=>cta.classList.add('show'),3800)}document.querySelector('#repeat').onclick=start;start();
</script></body></html>
